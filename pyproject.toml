[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "object-detector-trainer"
version = "0.1.0"
description = "Reusable multi-backend object detection training core"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "starwit" }]
dependencies = [
  "albumentations>=1.4.10",
  "imagehash>=4.3.1",
  "matplotlib>=3.9.0",
  "numpy>=2.2.0",
  "opencv-python>=4.10.0.84",
  "pandas>=2.2.3",
  "pillow>=11.0.0",
  "pycocotools>=2.0.11",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "rfdetr>=1.4.1",
  "ruamel-yaml>=0.18.14",
  "scikit-image>=0.25.0",
  "scikit-learn>=1.5.0",
  "supervision>=0.22.0",
  "tabulate>=0.9.0",
  "torch>=2.0.0",
  "tqdm>=4.67.1",
  "ultralytics==8.3.191",
]

[project.optional-dependencies]
rtmdet = [
  "mmdet>=3.3.0,<3.4.0",
  "mmengine>=0.10.7,<0.11.0",
  "mmcv>=2.1.0,<2.2.0",
]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
object-detector-trainer = "object_detector_trainer.cli:main"

[tool.setuptools.packages.find]
include = ["object_detector_trainer*"]

[tool.pytest.ini_options]
markers = [
  "heavy: opt-in integration tests (slower and/or environment-sensitive)",
]
testpaths = ["object_detector_trainer/tests"]
norecursedirs = [".venv", "venv", "site-packages"]

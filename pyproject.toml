[tool.poetry]
name = "object-detector-trainer"
version = "2.0.0"
description = "Prepare, train and evaluate object detectors (YOLO, RF-DETR) from one config"
authors = ["edblu1"]
license = "AGPL-3.0-only"
readme = "README.md"
packages = [{ include = "object_detector_trainer" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
imagehash = ">=4.3.1"
matplotlib = ">=3.9.0"
numpy = ">=2.2.0"
opencv-python = ">=4.10.0.84"
pycocotools = ">=2.0.11"
pydantic = ">=2.11.0"
pillow = ">=11.0.0"
pyyaml = ">=6.0.2"
rfdetr = {version = "1.9.4", extras = ["train"]}
scikit-image = ">=0.25.0"
tabulate = ">=0.9.0"
torch = ">=2.0.0"
ultralytics = "8.4.137"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
ruff = ">=0.6.0"

[tool.poetry.scripts]
object-detector-trainer = "object_detector_trainer.cli:main"

[tool.pytest.ini_options]
markers = [
  "heavy: opt-in integration tests (real backend training with isolated asset caches)",
]
testpaths = ["object_detector_trainer/tests"]
norecursedirs = [".venv", "venv", "site-packages"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90"]

[tool.ruff.lint.per-file-ignores]
# Kept byte-identical to the 1.x trainer.
"object_detector_trainer/find_duplicates.py" = ["I001", "B007"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
